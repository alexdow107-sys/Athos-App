name: Keep backend warm

# Pings the Render free-tier backend every ~10 minutes so it doesn't spin down
# (which causes ~30s cold starts). Free alternative to an external uptime pinger.
on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (with retry for cold starts)
        run: |
          URL="https://athos-api-qabs.onrender.com/api/"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "backend is warm"
              exit 0
            fi
            sleep 20
          done
          echo "backend did not return 200 (it was likely cold and is now waking)"
          # Don't fail the run — the ping itself still triggers the wake-up.
          exit 0
