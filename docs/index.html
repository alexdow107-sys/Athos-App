<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athos</title>
  <style>
    :root { --bg:#0f1115; --text:#e4ecf5; --muted:#8ca3be; --brand:#6bc5de; --border:#2c3a52; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .wrap { text-align:center; padding:40px 22px; max-width:480px; }
    h1 { font-size:44px; font-weight:900; letter-spacing:-1px; color:var(--brand); margin:0; }
    .tag { color:var(--muted); font-size:16px; font-weight:600; margin:6px 0 32px; letter-spacing:0.5px; }
    .links a { display:inline-block; margin:6px; padding:11px 22px; border:1px solid var(--border); border-radius:999px; color:var(--text); text-decoration:none; font-weight:700; font-size:14px; }
    .links a:hover { border-color:var(--brand); color:var(--brand); }
    .contact { margin-top:28px; color:var(--muted); font-size:14px; }
    .contact a { color:var(--brand); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Athos</h1>
    <div class="tag">Train. Track. Triumph.</div>
    <div class="links">
      <a href="./privacy.html">Privacy Policy</a>
      <a href="./terms.html">Terms of Service</a>
    </div>
    <div class="contact">Support: <a href="mailto:athosapp1@gmail.com">athosapp1@gmail.com</a></div>
  </div>
</body>
</html>
